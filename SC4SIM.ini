; SC4SIM.ini - settings of SC4SIM.dll (SC4 System Integration Module, Colossus Addon Mod).
; Keep it next to SC4SIM.dll. Without this file the defaults below are used.
;
; Advanced Water Management: see [AdvancedWaterManagement] below.
; Mixed R, C and I occupancy: see [MixedOccupancy] below.
; Manufacturing (I-M) zone: see [ManufacturingZone] below.
; Afterlife (fictitious mortality statistics and their news ticker): see [Afterlife] below.
; Game fixes (the "high-tech industry has no $$$ jobs" bug): see [GameFixes] below.
; Custom power poles: port of the sc4-render-services "re/custom-powerlines" sample (LGPL 2.1).
; Do not also install SC4PowerPoleCustomizationSample.dll: when it is loaded, SC4SIM leaves the power
; poles to it (it patches the same game code). Requires SimCity 4 1.1.641.

[AdvancedWaterManagement]
; Advanced Water Management: port of sc4-advanced-water-management by Nicholas Hayes (MIT).
; Shows the real efficiency of water buildings in the query dialog and tool tip, warns once a month when a
; fresh or salt water pump produces nothing (too far from its water source), and adds the ScanPumps cheat.
; Do not also install AdvancedWaterManagement.dll: when it is loaded, SC4SIM leaves water management to it.
Enabled=true

[MixedOccupancy]
; Residents, commercial and industrial jobs in one building (RC, RI, CI or RCI), with independent capacities.
; Applies only to buildings with Allow Joint Occupancy = true, an R, C or I Purpose and a Capacity Satisfied
; that lists types of at least two classes: residential (R$, R$$, R$$$), commercial (CS$, CS$$, CS$$$, CO$$,
; CO$$$) and industrial (I-A, I-D, I-M, I-HT). The secondary types need the building's own wealth; industry has
; a fixed one: I-A 1, I-D 2, I-M 2, I-HT 3. Every other building is unchanged.
; Not yet tested in game: try it on a copy of a city.
; The MixedOccupancy cheat writes every mixed lot to SC4SIM.log. See docs/mixed-occupancy.md.
Enabled=true

; Writes the MixedOccupancy report (every mixed lot, population and capacity of each type) to SC4SIM.log at
; the start of every month. The game itself fills the secondary types; this only reads them.
DebugLog=false

; Trips for the secondary classes. The game makes trips from the lot's zone only: commuters in R zones,
; freight in I zones, nothing in C zones. With this on, residents commute and industry ships freight whatever
; the zone, and the secondary shop and industry jobs become commute destinations (they count in the lot's trip
; capacity). Lots whose occupants all match their zone keep the game's code. Set to false if traffic misbehaves.
MixedTraffic=true

[ManufacturingZone]
; Manufacturing (I-M) zone on a reused zone slot. Try it on a copy of a region first.
; The I-M growth developer asks for the slot instead of dense/medium industry, so I-M grows only there and I-D and
; I-HT never do. Cheats: IMZone toggles the brush (the Dense Industrial tool then places the I-M zone),
; IMZoneConvert turns every empty dense industrial cell into the I-M zone, IMZoneInfo writes a report to SC4SIM.log.
; A city saved with I-M zones and opened without this module sees them as Spaceport (or Military).
; See docs/manufacturing-zone.md.
Enabled=true

; Zone slot reused for the I-M zone: 13 = Spaceport (default), 10 = Military. Check that nothing in your regions
; places that zone type first.
ZoneSlot=13

; Every growth stage fits the slot (the game says "never"). Required: without it the module changes nothing.
StageHook=true

; IsRCIZone answers true for the slot.
RCIZoneHook=true

; No land-value wealth test in the slot, as the game does for zones 7, 8 and 9.
IgnoreLandValue=true

; The slot gets the zone sizes and costs of medium industry, read after the Zone Manager exemplar, so zoning mods
; that override it (for example the Zoning Mod) keep working.
IndustrialTuning=true

; Zone colour: FSH instance (group 0x1ABE787D) of the zone texture; 0 = the medium industrial texture.
; 0x5C4D0D10 is the burnt-orange texture in SC4SIM_ManufacturingZone.dat.
ZoneTexture=0x5C4D0D10

; Colour of the zone while dragging, RRGGBBAA.
DragColour=0xDE681CFF

; Zone tool cursor (instance of type 0xAA5C3144); 0 = the game cursor (high density residential).
; 0x5C4D0D20 is the I-M cursor in SC4SIM_ManufacturingZone.dat.
Cursor=0x5C4D0D20

; Name of the zone in the hover tooltip: LTEXT instance in group 0xEA5524EB; 0 = the slot's game name.
; 0x5C4D0D04 is "Manufacturing Industrial" in SC4SIM_ManufacturingZone.dat. The tooltip lines are those of dense industry.
ZoneName=0x5C4D0D04

[Afterlife]
; Afterlife: fictitious Winner / Sinner / I.M.P. statistics, read-only with respect to the real simulation, and
; their headlines in the news ticker. When a city opens, the DLL registers run_afterlife_balance_variables and
; get_news_ticker_character in the advisor Lua and copies every result into afterlife_grid_var; afterlife_news.lua
; (CAM_LUA_Controller.dat) and CAM_Afterlife_News_en.dat show the news. AFTERLIFE.lua and PACK_CONSTANTS.lua are no
; longer needed: false turns the whole Afterlife off. See docs/afterlife.md.
Enabled=true

; Balance constants, in the DLL like the other CAM scripts keep theirs. Uncomment a line to change it.
; The defaults are the AFTERLIFE values of the former PACK_CONSTANTS.lua (mortality_ratio, judgment_ratio, imp_ratio,
; redemption_ratio, hell_native_ratio, hell_native_fixed); since 1.9.2 the Hell ratios are 20 times those values, and
; Heaven has its own native population (heaven_native_ratio, heaven_native_fixed).
;BASE_MORTALITY_RATE_PER_CAPITA=0.0006  ; monthly natural death rate per resident at 100% health coverage
;HEALTH_COVERAGE_WEIGHT=1.5  ; at 0% health coverage the rate is multiplied by (1 + this)
; (those two are used only when the game gives no life expectancy)
;LIFE_EXPECTANCY_DEATH_SCALE=1.0  ; deaths per month = residents * this / (12 * game.ga_life_exp)
;WAVE_DEATH_SHARE=0.05  ; share of a reset tract's residents counted as deaths (generation reset of the game)
;MAX_WAVE_DEATH_FRACTION_POP=0.01  ; all reset deaths of a month never exceed this share of the residents
;PREMATURE_SIN_BONUS=0.1  ; extra Sinner share for premature deaths (tract life expectancy below the reset age)
;DEATH_WAVES=1  ; 0 = do not read the residential simulator's generation resets
;TRACT_RESET_AGE=40  ; reset age of the residential tuning (property 0xCA027307)
;CHRONIC_RESET_INTERVAL_MONTHS=12  ; a tract reset every month counts as premature deaths once per this many months
;SAVE_WITH_CITY=1  ; keep Heaven, Hell, redeemed and I.M.P. totals in SC4SIM_Afterlife.ini when the city is saved
; Deathcare (1.9.4): cemeteries and crematoria collect the dead of the tracts in their radius; the rest stays uncollected.
; Buildings use the New_Properties.xml-patches properties 0x5C4DD001 (type: 1 cemetery, 2 crematorium), 0x5C4DD002
; (capacity: graves, or bodies per month) and 0x5C4DD003 (radius, meters), made with the Cemetery and Crematorium
; (SC4SIM Deathcare) generators under Hospital; they appear in the Deathcare submenu of the Health menu. Maxis and
; Reward cemeteries (occupant group 0x1700) count too. See docs/deathcare.md.
;DEATHCARE=1  ; 0 = no deathcare
;DEATHCARE_EFFECTS=1  ; 0 = uncollected dead do not lower the health of their tract
;DEATHCARE_GRAVES_PER_CELL=40  ; graves per lot cell of a cemetery without a capacity property (Maxis cemeteries)
;DEATHCARE_CREMATION_PER_MONTH=50  ; bodies per month of a crematorium without a capacity property
;DEATHCARE_RADIUS=1024  ; service radius in meters of a building without a radius property
;DEATHCARE_MAX_UNCOLLECTED_SHARE=0.1  ; uncollected dead never exceed this share of a tract's residents
;DEATHCARE_HQ_PENALTY_PER_PERCENT=0.5  ; health quotient lost per month for each 1% of uncollected dead in a tract
;DEATHCARE_MAX_HQ_PENALTY=3  ; most health quotient a tract loses in a month
;DEATHCARE_NOTIFY_UNCOLLECTED=50  ; notification (at most once a year) when the uncollected dead reach this; 0 = never
;DEATHCARE_NOTIFY_NEARLY_FULL=0.8  ; notification (at most once a year) when a cemetery is this full; 0 = never
;DEATHCARE_EMPTY_THRESHOLD=0.8  ; a cemetery this full is emptied by the crematoria in range with the room they have left
;DEATHCARE_AURA=1  ; 0 = uncollected dead give no negative transient aura (shown by the Transient Aura data view)
;DEATHCARE_AURA_PER_PERCENT=4  ; transient aura lost for each 1% of uncollected dead in a tract
;DEATHCARE_AURA_MAX=60  ; strongest negative transient aura (at most 127)
;EDUCATION_REFERENCE=100  ; city EQ (game.ga_education, 0-200) that counts as average (was 500 before 1.9.3)
;BASE_SIN_RATIO=0.5  ; share of the dead who become Sinners before crime and education
;CRIME_WEIGHT=0.3  ; how strongly ga_crime / 100 pushes toward Sinner
;EDUCATION_WEIGHT=0.3  ; how strongly education above the reference pulls toward Winner
;SIN_RATIO_MIN=0.1  ; lowest Sinner share (at least 10% go to Hell)
;SIN_RATIO_MAX=0.9  ; highest Sinner share (at least 10% go to Heaven)
;IMP_CLIENT_RATIO=0.002  ; share of Hell's Sinners who hire I.M.P. each cycle
;IMP_SUCCESS_CHANCE=0.15  ; share of those contracts that kill
;IMP_KILL_RANDOM_VARIANCE=2  ; random +/- on the I.M.P. kills (whole number)
;MAX_IMP_KILL_FRACTION_POP=0.01  ; I.M.P. kills never exceed this share of the residents
;REDEMPTION_RATIO=0.0015  ; share of Hell's Sinners redeemed into Winners each cycle
;HELL_IMP_RATIO=1.0  ; native Imps per Sinner
;HELL_HELLHOUND_RATIO=0.6  ; native Hellhounds
;HELL_SUCCUBUS_RATIO=0.4  ; native Succubi
;HELL_INFESTOR_RATIO=0.16  ; native Infestors
;HELL_POSSESSOR_RATIO=0.1  ; native Possessors
;HELL_BAPHOMET_RATIO=0.02  ; native Baphomets
;HELL_REAPER_RATIO=0.01  ; native Reapers
;HELL_GOETIA_ARS_GOETIA_RATIO=0.001  ; native Goetia and Ars Goetia
; Hell's natives (Hellborn) always outnumber the Souls in Hell: if these ratios are lowered, the missing natives are Imps.
;FALLEN_ANGELS=2  ; fixed number of Fallen Angels
;SEVEN_DEADLY_SINS=7  ; fixed number of Seven Deadly Sins
;HEAVEN_ANGEL_RATIO=1.0  ; native Angels per Winner
;HEAVEN_CHERUB_RATIO=0.6  ; native Cherubs
;HEAVEN_EXORCIST_RATIO=0.3  ; native Exorcists
;HEAVEN_SERAPHIM_RATIO=0.01  ; native Seraphim
; Heaven's natives (Heavenborn) always outnumber the Souls in Heaven: if these ratios are lowered, the missing natives are Angels.
;SERAPHIM_COUNCIL=3  ; fixed Seraphim council (Sera, Emily, the Speaker of God)

[GameFixes]
; Fix of a SimCity 4 bug: cSC4Lot::UpdateJobs compares the $$ and $$$ job counts with the $ trip capacity, so a count
; within 10 % of the $ count is never written and commuters of that wealth find no job there ("high-tech industry
; has no $$$ jobs"; also the Medical Clinic, the solar and nuclear plants and mixed lots). Two bytes make each check
; read its own wealth; no data fix is needed. Existing lots catch up when the game refreshes them. See
; docs/game-fixes.md.
TripCapacityWealthFix=true

[SC4PowerPoleCustomization]
; Lets power-pole prop exemplars declare custom cable attachment geometry and wire appearance.
; Properties are documented in docs/power-pole-customization.md. Props that define none of those
; properties remain on the unmodified vanilla rendering path.
Enabled=true

; Power lines across empty zones and farm fields (SC4SIM addition, see docs/power-lines-across-zones.md):
; poles can stand on zoned cells without a lot and on farm fields. Lots with a building still block.
CrossZones=true

; Removes the zone from the cell of every newly placed pole when the drag ends (needs CrossZones).
; Lots with a building are never touched.
DezoneUnderPoles=true

; Also dezone pole cells on farm fields. The game cannot take one cell from a lot, so it demolishes that
; field lot; the farm grows new fields around the pole. Set to false to keep fields untouched.
DezoneFieldCells=true

; Writes the [DEBUG] power-pole traces (FAR model selection, strand rebuilds, [zones] cells) to SC4SIM.log.
DebugLog=false

; Upper bound on attachment points and per-wire overrides accepted from one property.
; Vanilla has four wires; raise this to allow denser bundles. Valid range: 1-15.
MaxPointsPerDirection=8

; Optional named pole styles. REG.* keys describe the connected undirected headings:
; X = x axis, Z = z axis, DP = positive diagonal (+x,+z), DN = negative diagonal (+x,-z).
; Join multiple headings with + in canonical X,DP,Z,DN order. REG.None is the empty/default mask.
; Values are pole prop exemplar Instance IDs (Type 0x6534284A, Group matching vanilla's power-pole
; group unless your poles use a different one). A section can be sparse; missing combinations fall
; back to the vanilla instance for that mask. The complete key set is documented in
; docs/far-power-lines-design.md.
;
; FAR-<ratio>.<orient> keys route fractional-angle (FAR) drags to purpose-built angled pole models.
; Ratio is one of 1.5, 2, 3, 6 (slope 1:n, i.e. arctan(1/n) = 33.7/26.6/18.4/9.5 degrees). A FAR
; span is undirected, so each ratio has exactly four headings: XP/XN = 1:n tilted off the x axis
; with the minor step in +z / -z; ZP/ZN = the mirrored n:1 pair off the z axis with the minor step
; in +x / -x. Values are pole prop exemplar Instance IDs, same as REG.* keys. A FAR heading with no
; key falls back to the style's diagonal REG.* entry, then vanilla -- so cables still align even
; without dedicated art, just on the 45-degree mesh. Keys the game supports:
;   FAR-1.5.XP  FAR-1.5.XN  FAR-1.5.ZP  FAR-1.5.ZN
;   FAR-2.XP    FAR-2.XN    FAR-2.ZP    FAR-2.ZN
;   FAR-3.XP    FAR-3.XN    FAR-3.ZP    FAR-3.ZN
;   FAR-6.XP    FAR-6.XN    FAR-6.ZP    FAR-6.ZN
; A quarter-turn pairs perpendicular headings, so XP/ZN may share one model and XN/ZP a second --
; two logical models per ratio; the four keys may alias two instance IDs. An optional
; [PowerPoles.FAR] section (never a cyclable style) supplies FAR headings as a style-independent
; default, consulted after the active style and before the diagonal REG.* fallback.
;
; A style may also set InterPoleDistance = the max number of cells between poles while that style is
; active (vanilla is 10; range 1-50). Larger = poles farther apart / fewer poles. It applies only
; while the style is active and is restored to vanilla otherwise. A style may set only
; InterPoleDistance (no REG.* keys) to change spacing without changing pole models.
;
; Switching styles in-game: with the power-line tool active, Tab cycles forward through vanilla +
; every style below and Shift+Tab cycles backward (applies to newly-placed poles only, not existing
; ones). SC4SIM has no on-screen overlay: the active style is written to SC4SIM.log. FAR routing is independent of the active style: hold Shift while dragging
; to force a regular (non-FAR) heading.
;
;[PowerPoles.Steel]
;REG.None=0x05000205
;REG.X=0x05000205
;REG.DP=0x05000405
;REG.X+Z=0x05000105
;FAR-2.XP=0x05000505
;FAR-2.ZN=0x05000505
;FAR-2.XN=0x05000605
;FAR-2.ZP=0x05000605
;InterPoleDistance=14
;...
;
;[PowerPoles.Wood]
;REG.None=0x06000205
;REG.X+Z=0x06000105
;InterPoleDistance=7
;...
;
; Style-independent FAR fallback (optional):
;[PowerPoles.FAR]
;FAR-3.XP=0x07000505
;FAR-3.ZN=0x07000505
;
; ---------------------------------------------------------------------------
; WORKING EXAMPLE -- FA-2 (26.6 degree) poles using the P3 wood tangent meshes.
; Requires two things in your Plugins folder:
;   1. SC4PowerPoleFA2Example.dat (from sc4-render-services, not included in its source branch; two pole
;      prop exemplars, instances 0xB07EFA20/0xB07EFA21, pointing at the P3 26.6-degree tangent
;      S3D models NL266/NR266).
;   2. The P3 model pack (MTO_P3_ModelsVol01) providing those S3D meshes.
; Uncomment to route every FA-2 drag to the angled art under any style. A quarter-turn pairs
; XP with ZN and XN with ZP; if a heading renders 90 degrees off, swap the two instance IDs
; between the pairs (or set the invert-quarter-turn exemplar property on one of the props).
;[PowerPoles.FAR]
;FAR-2.XP=0xB07EFA20
;FAR-2.ZN=0xB07EFA20
;FAR-2.XN=0xB07EFA21
;FAR-2.ZP=0xB07EFA21
;
; ---------------------------------------------------------------------------
; P3 POLES OF THE SIM EXPERIMENTAL PACKAGE (CAM_PowerPoles.dat, 20 pole prop exemplars, group 0x088E1962, from the
; custom-powerlines sample of sc4-render-services). They use the meshes of Metarvo's P3 set (MTO P3), included with
; his permission in CAM_PowerPoles_Models.dat.
;   0x09110205 / 0x09110405  P3 wood H-frame, straight / diagonal
;   0x09120205 / 0x09120405  P3 Texas steel V, straight / diagonal (two circuits, thinner shield wire)
;   0x09130xxx               P3 wood H-frame FAR tangents (N meshes: NL = XP/ZN, NR = XN/ZP)
;   0x09131xxx               the same FAR tangents on the diagonal-based D meshes (DL/DR), an alternative to 0x09130xxx
; The two styles are cycled with Tab like any other; vanilla stays the default. Junctions (X+Z, X+DP, ...) keep the
; vanilla poles.
[PowerPoles.P3Wood]
REG.None=0x09110205
REG.X=0x09110205
REG.Z=0x09110205
REG.DP=0x09110405
REG.DN=0x09110405
FAR-1.5.XP=0x09130337
FAR-1.5.ZN=0x09130337
FAR-1.5.XN=0x09130338
FAR-1.5.ZP=0x09130338
FAR-2.XP=0x09130266
FAR-2.ZN=0x09130266
FAR-2.XN=0x09130267
FAR-2.ZP=0x09130267
FAR-3.XP=0x09130184
FAR-3.ZN=0x09130184
FAR-3.XN=0x09130185
FAR-3.ZP=0x09130185
FAR-6.XP=0x09130095
FAR-6.ZN=0x09130095
FAR-6.XN=0x09130096
FAR-6.ZP=0x09130096

