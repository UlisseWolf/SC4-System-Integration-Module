name: Build

# Builds SC4SIM.dll on every push to master and every pull request into master.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win32:
    # A manual run builds only master.
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master' }}
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build DLL
        shell: powershell
        run: |
          cmake -S . -B build -A Win32
          cmake --build build --config Release --parallel

      - name: Verify DLL output
        shell: powershell
        run: |
          $dll = "build/Release/SC4SIM.dll"
          if (-not (Test-Path -LiteralPath $dll)) {
            throw "$dll is missing"
          }
          if ((Get-Item -LiteralPath $dll).Length -le 0) {
            throw "DLL is empty: $dll"
          }
          "DLL_PATH=$((Resolve-Path $dll).Path)" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.repository.name }}-Release-${{ github.sha }}
          compression-level: 0
          path: |
            ${{ env.DLL_PATH }}
            SC4SIM.ini
