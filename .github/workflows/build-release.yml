# Builds SC4SIM.dll on every push to master and publishes SC4SIM-<version>.zip (SC4SIM.dll, SC4SIM.ini and the
# license files in Licenses/) as a GitHub release. The version comes from SIM_DLL_VERSION_STR in src/version.h: a new release (tag
# v<version>) is created only when that version has no release yet, so bump src/version.h to publish.
name: Build and release SC4SIM.dll

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      replace_asset:
        description: Replace the zip of an existing release with the same version
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-release-master
  cancel-in-progress: false

jobs:
  build:
    # Manual runs are accepted only on master as well.
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2022

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build (Release | x86)
        run: msbuild SC4SIM.sln /m /nologo /p:Configuration=Release /p:Platform=x86

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path src/version.h -Pattern '#define\s+SIM_DLL_VERSION_STR\s+"([^"]+)"'
          if (-not $match) { throw "SIM_DLL_VERSION_STR not found in src/version.h" }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "SC4SIM.dll version $version"

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $dll = 'bin/Release/SC4SIM.dll'
          if (-not (Test-Path $dll)) { throw "$dll was not built" }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item $dll package/
          Copy-Item SC4SIM.ini package/
          # SC4SIM.dll is LGPL-3.0; the code it includes from other projects keeps its own license.
          New-Item -ItemType Directory -Force -Path package/Licenses | Out-Null
          Copy-Item LICENSE package/Licenses/LICENSE-SC4SIM-LGPL-3.0.txt
          Copy-Item src/powerpoles/LICENSE-sc4-render-services.txt package/Licenses/LICENSE-sc4-render-services-LGPL-2.1.txt
          Copy-Item src/water/LICENSE-sc4-advanced-water-management.txt package/Licenses/LICENSE-sc4-advanced-water-management-MIT.txt
          Copy-Item vendor/gzcom-dll/LICENSE package/Licenses/LICENSE-gzcom-dll-LGPL-2.1.txt
          Copy-Item vendor/mINI/LICENSE package/Licenses/LICENSE-mINI-MIT.txt
          @(
            "SC4SIM.dll $version - SC4 System Integration Module DLL (Colossus Addon Mod)",
            "Source code: ${{ github.server_url }}/${{ github.repository }}",
            "",
            "SC4SIM.dll is licensed under the GNU Lesser General Public License v3.0 (LICENSE-SC4SIM-LGPL-3.0.txt).",
            "It includes code from other projects, which keeps its own license:",
            "- custom power poles: sc4-render-services by caspervg, LGPL 2.1 (LICENSE-sc4-render-services-LGPL-2.1.txt)",
            "- Advanced Water Management: sc4-advanced-water-management by Nicholas Hayes, MIT (LICENSE-sc4-advanced-water-management-MIT.txt)",
            "- gzcom-dll: LGPL 2.1 (LICENSE-gzcom-dll-LGPL-2.1.txt)",
            "- mINI: MIT (LICENSE-mINI-MIT.txt)"
          ) | Set-Content -Path package/Licenses/README.txt -Encoding utf8
          $zip = "SC4SIM-$version.zip"
          Compress-Archive -Path package/* -DestinationPath $zip -Force
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: SC4SIM-${{ steps.version.outputs.version }}
          path: package/
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0 -and '${{ inputs.replace_asset }}' -eq 'true') {
            gh release upload $tag '${{ steps.package.outputs.zip }}' --clobber
            Write-Host "Release ${tag}: zip replaced."
            exit 0
          }
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists: build checked, nothing published. Bump src/version.h to publish a new release."
            exit 0
          }
          gh release create $tag '${{ steps.package.outputs.zip }}' `
            --target '${{ github.sha }}' `
            --title "SC4SIM.dll $version" `
            --notes "SC4SIM.dll $version for SimCity 4 1.1.641. Copy SC4SIM.dll and SC4SIM.ini to the top level of the Plugins folder. See the README for the features and settings."
