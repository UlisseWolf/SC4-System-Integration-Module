# Builds SC4SIM.dll on every push to staging and keeps it as a build artifact (SC4SIM.dll, SC4SIM.ini and the license
# files). It publishes nothing: releases come only from master (build-release.yml).
name: Build SC4SIM.dll (staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-staging
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/staging'
    runs-on: windows-2022

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build (Release | x86)
        run: msbuild SC4SIM.sln /m /nologo /p:Configuration=Release /p:Platform=x86

      - name: Package
        shell: pwsh
        run: |
          $dll = 'bin/Release/SC4SIM.dll'
          if (-not (Test-Path $dll)) { throw "$dll was not built" }
          New-Item -ItemType Directory -Force -Path package/Licenses | Out-Null
          Copy-Item $dll package/
          Copy-Item SC4SIM.ini package/
          Copy-Item LICENSE package/Licenses/LICENSE-SC4SIM-LGPL-3.0.txt
          Copy-Item src/powerpoles/LICENSE-sc4-render-services.txt package/Licenses/LICENSE-sc4-render-services-LGPL-2.1.txt
          Copy-Item src/water/LICENSE-sc4-advanced-water-management.txt package/Licenses/LICENSE-sc4-advanced-water-management-MIT.txt
          Copy-Item vendor/gzcom-dll/LICENSE package/Licenses/LICENSE-gzcom-dll-LGPL-2.1.txt
          Copy-Item vendor/mINI/LICENSE package/Licenses/LICENSE-mINI-MIT.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: SC4SIM-staging-${{ github.sha }}
          path: package/
          if-no-files-found: error
